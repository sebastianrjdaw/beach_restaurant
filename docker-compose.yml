services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beach_restaurant_php
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_NAME: "Restaurante A Saina"
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: beach_restaurant
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      VITE_APP_NAME: "Restaurante A Saina"
      VITE_DEV_SERVER: ${VITE_DEV_SERVER:-false}
      VITE_HMR_HOST: ${VITE_HMR_HOST:-localhost}
      VITE_USE_POLLING: "true"
    ports:
      - "8000:8000"
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules

  mysql:
    image: mysql:8.4
    container_name: beach_restaurant_mysql
    environment:
      MYSQL_DATABASE: beach_restaurant
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ularavel -psecret --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  node_modules:
  vendor:
